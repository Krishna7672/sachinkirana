<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sachin Kirana</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container card">
        <div class="login-header">
            <h2>Sachin Kirana POS</h2>
            <p class="sub-text">Please log in to access the billing system.</p>
        </div>
        
        <form id="login-form">
            <div class="input-group mb-15">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="admin@store.com" required>
            </div>
            <div class="input-group mb-15">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" id="login-btn" style="width: 100%;">
                Log In
            </button>
            <p id="login-error" class="error-msg" style="display: none; color: red; margin-top: 10px; font-size: 0.85rem; text-align: center;"></p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
